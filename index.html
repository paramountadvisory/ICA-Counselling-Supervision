<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICA Counselling &amp; Supervision | New Clinician Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--cream:#FAF2E7;--paper:#FFFBF4;--forest:#2F5B3F;--sage:#95B697;--gold:#E3B965;--rust:#B5701C;--ink:#25332A;--line:#E6D8C3;--h:"Fraunces",Georgia,serif;--b:"Figtree",system-ui,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.65 var(--b);display:flex;min-height:100vh;-webkit-print-color-adjust:exact;print-color-adjust:exact}
aside{width:300px;flex:none;position:sticky;top:0;height:100vh;overflow:auto;background:var(--cream);border-right:1px solid var(--line);padding:22px 20px;display:flex;flex-direction:column;gap:16px}
aside img{width:100%;max-width:250px}
.pg b{font-size:14px;color:var(--forest)}.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sage),var(--forest));transition:width .7s cubic-bezier(.2,.8,.2,1)}
#nav{list-style:none;margin:0;padding:0;display:grid;gap:4px}
#nav button{all:unset;box-sizing:border-box;width:100%;display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;cursor:pointer;font-size:14px;line-height:1.3;transition:background .25s,color .25s}
#nav button:hover{background:#F1E6D2}#nav .on{background:var(--forest);color:#fff}#nav .lock{opacity:.45;cursor:not-allowed}
#nav button:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.k{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--sage);display:grid;place-items:center;font-size:12px;font-weight:600;transition:all .3s}
#nav .done .k{background:var(--sage);border-color:var(--sage);color:#fff}#nav .on .k{border-color:var(--gold);color:var(--gold)}#nav .on.done .k{background:var(--gold);color:var(--forest)}
.ct{margin-top:auto;font-size:13px;color:#4b5a50;border-top:1px solid var(--line);padding-top:12px}.ct a{color:var(--forest)}
main{flex:1;min-width:0;padding:48px clamp(20px,5vw,72px) 72px}
#stage{max-width:820px;margin:0 auto;opacity:0}#stage.in{animation:rise .55s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1{font:700 clamp(30px,4.4vw,46px)/1.12 var(--h);color:var(--forest);margin:0 0 6px}
.sub{color:var(--rust);font:italic 500 19px var(--h);margin:0 0 28px}
.hero{display:flex;gap:28px;align-items:center;margin-bottom:30px;flex-wrap:wrap}
.sun{width:132px;height:132px;border-radius:50%;background:var(--sage);position:relative;overflow:hidden;flex:none}
.sun:before{content:"";position:absolute;left:34px;top:42px;width:64px;height:32px;border-radius:64px 64px 0 0;background:var(--gold);animation:set 1.6s ease-out both}
.sun:after{content:"";position:absolute;left:30px;right:30px;top:88px;height:3px;background:var(--cream);box-shadow:0 14px 0 var(--cream)}
@keyframes set{from{transform:translateY(34px)}to{transform:none}}
.blk{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--sage);border-radius:6px 16px 16px 6px;padding:20px 24px;margin:0 0 18px;transition:border-color .3s,box-shadow .3s}
.blk:hover{border-left-color:var(--gold);box-shadow:0 6px 18px rgba(47,91,63,.08)}
h3{font:700 21px var(--h);color:var(--forest);margin:0 0 10px}.blk p{margin:0 0 10px}
.blk ul{list-style:none;margin:0 0 6px;padding:0}.blk li{position:relative;padding-left:22px;margin:7px 0}
.blk li:before{content:"";position:absolute;left:2px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--gold)}
.tick{display:flex;gap:14px;align-items:center;margin:30px 0 18px;padding:16px 20px;background:#EAF1E8;border:2px solid var(--sage);border-radius:14px;cursor:pointer;font-weight:600;color:var(--forest)}
.tick input{width:24px;height:24px;accent-color:var(--forest)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:12px 26px;font:600 16px var(--b);background:var(--forest);color:#fff;cursor:pointer;transition:transform .2s,background .2s,opacity .2s}
.btn:hover:not(:disabled){transform:translateY(-2px);background:#24492F}.btn:disabled{opacity:.4;cursor:not-allowed}.btn.g{background:transparent;color:var(--forest);border:2px solid var(--sage)}
.form{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0 28px}.form input{flex:1;min-width:240px;padding:12px 16px;border:2px solid var(--sage);border-radius:12px;font:17px var(--b);background:#fff}
#err{color:#9b2c1c;min-height:24px;margin:-16px 0 10px}
#cert{display:none;aspect-ratio:1.414/1;background:var(--paper);border:3px solid var(--forest);outline:2px solid var(--gold);outline-offset:-14px;padding:3% 5%;text-align:center;flex-direction:column;align-items:center;justify-content:space-between;container-type:inline-size}
#cert.show{display:flex;animation:rise .7s both}#cert img{width:26cqw}
#cert h2{font:700 5.2cqw var(--h);color:var(--forest);margin:0}#cert .t{font-size:1.7cqw;margin:0;color:#4b5a50}
#cn{font:700 5cqw var(--h);color:var(--rust);border-bottom:2px solid var(--gold);padding:0 4cqw;margin:0}
#cm{columns:2;text-align:left;font-size:1.55cqw;line-height:1.5;margin:0;padding-left:3cqw;max-width:86%}
.ft{display:flex;justify-content:space-between;width:100%;align-items:flex-end;font-size:1.6cqw}.ft div{max-width:46%}.ft .s{border-top:2px solid var(--forest);padding-top:4px}
@media(max-width:860px){body{display:block}aside{position:static;width:auto;height:auto;border:0}#nav{grid-template-columns:1fr 1fr}main{padding-top:20px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#stage{opacity:1}}
@page{size:A4 landscape;margin:0}
.gh{font:700 26px var(--h);color:var(--forest);margin:34px 0 4px}.gd{margin:0 0 16px;color:#4b5a50}
.tn{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tn li{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--sage);border-radius:6px 14px 14px 6px;padding:10px 14px;transition:border-color .3s,transform .3s}
.tn li:hover{border-left-color:var(--gold);transform:translateX(3px)}
.tn h4{font:700 17px var(--h);color:var(--forest);margin:0}.tn b{display:block;font-size:13px;color:var(--rust);font-weight:500}
@media print{aside,.ui{display:none!important}body,main{display:block;padding:0;background:#fff}#stage{opacity:1;max-width:none}#cert{width:297mm;height:210mm;aspect-ratio:auto;border-width:4px}}
</style></head><body>

const M=[
{t:"Welcome to ICA",s:"Every act of healing is an act of rebellion",b:[
["Our story",["~ICA Counselling & Supervision was founded by Ilda Caeiro-Azzam, MSW, RSW, a registered social worker and psychotherapist with more than 21 years of clinical experience in trauma, complex PTSD, and work alongside refugee, newcomer, and marginalized communities.","~What began as one clinician’s practice has grown into a multilingual team of registered social workers, psychotherapists, supervised clinicians, and graduate learners, united by trauma-informed, anti-oppressive, culturally responsive care.","~ICA is an approved provider under IFHP and NIHB, delivers interpreter-supported virtual care as a core model, and works with clients virtually across Ontario, Nova Scotia, and Quebec, and in person in the Hamilton/Ancaster area.","~Ilda is also a published author; her books include Colour Your Calm and From Trauma to Tenderness."]],
["What we believe",["Healing is relational. Clients are matched to clinicians by language, culture, faith, and identity, not just calendar availability.","Access is a clinical issue. ICA bills IFHP, NIHB, and WSIB directly, offers sliding scale and reduced-rate intern sessions, provides interpreters at no cost, and delivers care virtually across provinces.","Culture is not a barrier to work around; it is a resource to work with.","Clinicians deserve care too. ICA trains and supervises the next generation of therapists and takes burnout, vicarious trauma, and reflective practice seriously."]],
["Who we serve",["~Everyone is welcome, with particular depth in working with refugee claimants and newcomers, BIPOC communities, 2SLGBTQ+ clients, injured workers navigating WSIB, survivors of complex trauma and intimate partner violence, and helping professionals carrying compassion fatigue.","~Sessions are offered in English, French, Arabic, Farsi, Urdu, Portuguese, Spanish, Dari, Somali, Russian, and Bangla, with professional interpretation for other languages at no cost to the client."]],
["Beyond the therapy room",["~ICA offers pro-bono and community-partnered services, facilitates psychoeducational workshops in community settings, and advocates publicly for equitable access to mental health care for refugees and newcomers. Partnership enquiries: info@icacounselling.ca."]],
["Land acknowledgement",["~ICA is located in Hamilton, Ontario, on the traditional territories of the Erie, Neutral, Huron-Wendat, Haudenosaunee, and Mississaugas, protected by the Dish With One Spoon Wampum Belt Covenant and the Between the Lakes Purchase of 1792. Because ICA practises virtually, its work also reaches clients on the traditional and treaty territories of many First Nations, Inuit, and Métis communities across Ontario, Nova Scotia (Mi’kma’ki), and Quebec.","~An acknowledgement is a beginning, not an offset. ICA’s commitments:","Provide services through the Non-Insured Health Benefits (NIHB) program for eligible First Nations and Inuit clients.","Maintain and share Indigenous-led crisis and wellness resources, including the Hope for Wellness Helpline and the MMIWG Crisis Line.","Pursue ongoing education in cultural safety and trauma-informed care, and hold clinical work accountable to the Truth and Reconciliation Commission’s Calls to Action, particularly Calls 18–24.","Listen and learn, honouring Indigenous voices, resilience, and ways of knowing, and correct ourselves when we fall short.","~To learn whose land you live and work on: native-land.ca"]]]},
{t:"Meet the ICA Team",s:"Our team: the people you will work and learn alongside",team:1,b:[["About the team",["~ICA is a multilingual team of registered social workers, psychotherapists, supervised clinicians, graduate learners, and a registered nurse. Get to know your colleagues and supervisors below."]]]},
{t:"New Clinician Onboarding",s:"SOP: New Clinician Onboarding & Pre-Service Requirements (2026)",b:[
["Purpose and scope",["~Mandatory onboarding for all new clinicians, associates, and interns before providing psychotherapy under ICA, to ensure regulatory compliance, ethical practice, client safety, and operational readiness. Applies to independent contractors, associates, RP (Qualifying) clinicians, interns, and supervisors."]],
["Required documentation (pre-service)",["Signed Independent Contractor Agreement OR Intern/Associate Agreement","Signed Confidentiality Agreement","Signed Supervision Agreement (if applicable)","Signed Governance Manual Acknowledgement","Signed SOP Acknowledgement (Documentation, Supervision, Virtual Practice, Communication, Promotion, etc.)","Proof of active registration (CRPO / OCSWSSW / relevant regulatory body)","Copy of professional liability insurance (minimum required coverage)","Vulnerable Sector Check (if applicable to role/program)","Government-issued identification (for verification)","Direct deposit or payment processing information (if applicable)","Professional biography and headshot for website profile","Completed onboarding checklist"]],
["Required material review",["ICA Governance Manual","Clinical Documentation SOP (CRPO/OCSWSSW aligned)","Supervision Structure & WhatsApp Conduct SOP","Virtual Workspace & Privacy SOP","IFHP Compliance Policy (if applicable)","Promotion & Caseload Development SOP","Sick Leave & Communication Standards SOP","Risk & Crisis Escalation Protocol","Jane platform usage guidelines","Privacy and PHIPA obligations summary","~Clinicians must confirm in writing that all documents have been reviewed before client access is activated."]],
["Platform and technology setup",["Jane account activated and secure login established","Two-factor authentication enabled","Professional email signature configured (clinic email only)","Calendar availability entered into Jane","Secure video platform tested","Clinical documentation templates reviewed","Out-of-office and cancellation settings reviewed","Workspace privacy standards verified"]],
["Supervision orientation",["Initial supervision meeting scheduled","Review of supervision structure and expectations","Clarification of risk disclosure protocol","Review of supervision preparation requirements","Agreement on caseload growth plan","Clarification of KPI standards and expectations"]],
["Client activation criteria",["~Clinicians may not begin seeing clients until:","All documentation in the pre-service list is received and approved","All required materials are reviewed and acknowledged","Jane platform access is fully configured","Supervision orientation (if applicable) is completed","The Clinical Director provides formal written approval for activation"]],
["Initial orientation meeting",["Review of ICA values and trauma-informed framework","Clarification of reporting structure","Review of documentation timelines (24–48 hours)","Review of communication boundaries (Jane-only client messaging)","Review of referral flow and case assignment process","Review of KPI expectations","Discussion of professional growth goals"]],
["First 90-day review period",["Documentation audit may occur within the first 30–60 days","Caseload growth discussion in supervision","Performance feedback meeting at 90 days","Adjustment of development plan if required"]],
["Non-compliance",["Incomplete documentation will delay activation","Failure to provide proof of registration or insurance will prevent service delivery","Failure to review required materials may result in onboarding suspension","Providing services before activation is grounds for immediate review","~This SOP is reviewed annually or as regulatory requirements change. Amendments require approval by the Clinical Director."]]]},
{t:"Supervision Standards & WhatsApp Policy",s:"SOP: Supervision Standards & Professional Communication Policy (2026)",b:[
["Purpose and scope",["~Formal supervision standards for interns, associates, and licensed clinicians, including preparation, professional conduct, and appropriate use of group communication platforms such as WhatsApp. Applies to student interns, RP (Qualifying) clinicians, associates, and fully licensed clinicians."]],
["Supervision structure",["Interns: weekly dyadic supervision; additional support for high-risk cases","Associates/RP (Qualifying): frequency aligned with regulatory requirements","Licensed clinicians: up to 2 hours monthly supervision (if KPI standards are met)","Supervision may include documentation review, case consultation, risk review, and skill development"]],
["What to bring to supervision",["Brief case summaries (no full narrative retelling)","Specific clinical questions or areas of uncertainty","Risk assessment updates for high-risk clients","Treatment plan review and measurable goals","Documentation for review (if requested)","Reflection on countertransference or ethical concerns where relevant","Update on caseload numbers and professional development goals","~Supervision is a structured clinical consultation space. Passive attendance without preparation does not meet expectations."]],
["Supervisee responsibilities",["Attend punctually and remain present for the full session","Disclose all risk-related concerns immediately","Implement supervisory feedback in clinical practice","Maintain documentation standards between sessions","Track and log required supervision hours for regulatory reporting","Maintain professional conduct during supervision"]],
["Supervisor responsibilities",["Provide structured, ethical, and culturally responsive supervision","Ensure client safety and supervisee competence","Offer constructive and corrective feedback where necessary","Escalate concerns where ethical or safety issues arise","Maintain supervision documentation where required"]],
["Risk and escalation protocol",["All suicide, self-harm, violence, or duty-to-report concerns must be disclosed immediately","Supervision must occur before continuation of care where serious risk is identified","Safety planning must be documented and reviewed","Failure to disclose risk may result in disciplinary action"]],
["WhatsApp group: professional conduct",["~Purpose: administrative announcements, scheduling reminders, general clinic updates, and professional development opportunities.","~Strict prohibitions:","NO discussion of identifiable client information","NO sharing of private patient details, even if de-identified","NO screenshots of client files or communications","NO clinical case consultation in WhatsApp","NO personal disputes or informal complaints","NO use of WhatsApp for emergency client communication","~All clinical case discussion must occur within scheduled supervision or via secure, approved clinical platforms.","~Tone: maintain professional, respectful communication; avoid informal or inappropriate language; handle disagreements privately and professionally. The Clinical Director may moderate the group."]],
["Documentation and enforcement",["Supervision attendance logs are maintained; action items are documented and followed up","Regulatory-required supervision hours are tracked; audit records are retained in line with privacy standards","Failure to prepare may result in corrective review; repeated missed supervision may result in referral suspension","WhatsApp privacy violations may result in immediate removal and formal review; serious confidentiality breaches may result in termination and regulatory reporting","~Reviewed annually; amendments require approval by the Clinical Director."]]]},
{t:"Virtual Workspace, Privacy & Dress Code",s:"SOP: Safe, Private & Confidential Virtual Psychotherapy Workspace (2026)",b:[
["Purpose and core principles",["~Mandatory standards for a safe, private, and confidential virtual workspace, in line with CRPO and OCSWSSW standards, PHIPA/PIPEDA, and professional ethics. Applies to interns, associates, and licensed clinicians.","Client confidentiality is non-negotiable","Professionalism is maintained at all times","Virtual practice requires the same privacy standards as in-person practice","Technology must support, not compromise, clinical care","Workspaces reflect trauma-informed and culturally respectful practice"]],
["Physical workspace",["Sessions are held in a private, enclosed room with a door that closes; no other individuals present","Use white noise or sound buffering where needed; headphones are strongly recommended","Ensure conversations cannot be overheard by household members or others","Background is neutral, professional, and free of distracting items; no personal photographs, political signage, or confidential materials visible","Lighting allows clear visibility of the clinician’s face; virtual backgrounds must be professional"]],
["Dress code",["Professional attire appropriate for a therapeutic setting; modest, clean, and non-distracting","No sleepwear, gym wear, or visibly casual home attire","Avoid large logos, political messaging, or controversial statements","Grooming consistent with professional standards","Camera framing shows the clinician from the shoulders up"]],
["Secure technology",["All sessions use ICA-approved platforms (e.g., Jane video); no personal FaceTime, Zoom, WhatsApp, or unapproved platforms","Client messaging only within Jane secure messaging","Devices are password protected, with multi-factor authentication where available and automatic lock after short inactivity","No client information on personal desktop files; antivirus and software updates maintained","Secure, password-protected Wi-Fi; no public Wi-Fi for sessions; VPN recommended when appropriate; router security kept up to date"]],
["Documentation and file handling",["All charting occurs directly within Jane","No downloading of client files onto personal devices","No printing unless absolutely necessary and approved; if printed, store securely and shred when appropriate","Screens must not be visible to others during documentation"]],
["Interruptions and emergencies",["Mobile phones silenced and notifications disabled during sessions","Pets, children, or others must not interrupt sessions; address and document any interruption if clinically relevant","Obtain and document the client’s physical location at the start of session when required","Maintain emergency contact information on file and have crisis resources readily available","Have a clear plan for disconnection or technology failure; document all emergency-related actions"]],
["Professional boundaries and remote work",["No sessions from vehicles, public spaces, or shared living areas","No multitasking; no eating meals during sessions (water permitted); maintain full attention","Avoid blurred boundaries between personal and professional space","Maintain ergonomic seating, a stable internet connection, regular audio/video tests, and updated equipment"]],
["Non-compliance",["Failure to maintain a confidential workspace may result in corrective review","Use of unsecured platforms may result in referral suspension","Repeated privacy breaches may result in termination and regulatory reporting","Supervisors may request a virtual workspace review if concerns arise","~Reviewed annually; amendments require approval by the Clinical Director."]]]},
{t:"Charting & Clinical Records",s:"SOP: Charting & Clinical Record Best-Practice Guidelines (CRPO / OCSWSSW aligned, 2026)",b:[
["Purpose and scope",["~Minimum and best-practice charting requirements to protect client safety, support continuity of care, demonstrate ethical decision-making, and meet CRPO, OCSWSSW, and PHIPA expectations. Applies to all ICA clinicians, associates, and interns, virtual or in person, including IFHP, insurer-funded (e.g., MVA), and private-pay services."]],
["Core principles",["Accuracy: chart what occurred, not what you intended to occur","Timeliness: chart promptly","Objectivity and professionalism: neutral language; avoid pejorative or speculative statements","Relevance: document only what is clinically relevant and necessary (“minimum necessary”)","Confidentiality: protect PHI in storage, communication, and access","Transparency: document informed consent and key clinical decisions","Continuity: notes must let another competent clinician understand what happened and the plan"]],
["Required components of the record",["Administrative and identity information, service modality, dates of service, attendance, and provider identity and credentials","Informed consent for psychotherapy (nature of services, risks/benefits, confidentiality and limits, fees/cancellation, electronic practice, record-keeping)","Consent for collection, use, and disclosure of PHI, and for recording if ever used","Intake/assessment summary, treatment plan with measurable goals and review dates, progress notes for each clinical contact","Outcome measures where used (e.g., PHQ-9, GAD-7), risk assessments and safety planning","Collateral communications, reports and letters issued, and termination/transfer summary"]],
["Charting timelines (ICA standard)",["Session notes within 24 hours of the session (maximum 48 hours)","Risk-related documentation (suicide, self-harm, violence, duty to report) immediately after the contact","Reports/letters within contracted timelines; document any delays and related communications"]],
["Progress note standards",["~ICA accepts DAP, SOAP, or a clearly organized narrative note. Include, when applicable:","Date/time, modality, and duration","Presenting focus and key themes","Interventions used and clinical rationale where needed","Client response and progress toward goals","Risk updates and protective factors","Plan: next steps, homework/practice, referrals, scheduling, follow-up","Clinical consultation/supervision actions (e.g., “discussed with supervisor”)"]],
["Psychotherapy-specific charting",["Document your therapeutic approach and the client’s consent to it (e.g., CBT, EFT, DBT skills)","Document clinical reasoning for key decisions (safety planning, referrals, boundaries, treatment changes)","Document supervision/consultation for complex, high-risk, or scope-of-practice questions","Registrants performing the controlled act of psychotherapy: notes reflect competence, supervision (as needed), and rationale"]],
["Electronic practice and secure communication",["All messaging and file sharing through ICA-approved secure systems (e.g., Jane)","No personal email, personal texting, or social media for client communication","Document clinically relevant electronic contacts (date, purpose, summary, plan)","Maintain privacy in your physical environment; use strong passwords and multi-factor authentication"]],
["Corrections, late entries and record integrity",["Do not delete or rewrite a record to remove errors; use the platform’s amendment function","Amendments include date/time, who amended, reason, and what is corrected","Label late notes as a “late entry” with a brief reason","Maintain an auditable trail; records must be retrievable and defensible"]],
["Confidentiality, retention and storage",["Chart that confidentiality and its limits were reviewed at intake; document consent or legal authority for any disclosure (what, to whom, why)","Document and follow ICA procedures for client access or correction requests","Records are retained 10 years after last contact (or 10 years after age of majority for minors), unless a longer period is required","Store records only in approved systems; no client PHI on personal devices, email, or unapproved cloud drives; destruction follows ICA procedures"]],
["Quality assurance and supervision",["ICA may conduct random or targeted chart audits; respond to audit requests within ICA timelines (typically 48 hours)","Audit outcomes may include coaching, remediation, increased supervision, or performance planning","Bring 1–3 charting questions or samples to supervision, and document supervisory consultation that informs clinical decisions"]],
["Minimum standard checklist",["Consent documented (services, confidentiality, electronic practice, fees where applicable)","Session note completed within 24–48 hours","Interventions and plan documented","Risk assessed/documented when relevant","Treatment plan/goals present and reviewed periodically","Collaterals/releases documented properly","No personal email/text used; secure communication only","~Missed timelines or quality standards may trigger coaching, increased supervision, referral suspension, or termination. Privacy breaches may result in immediate removal from files, termination, and regulatory reporting. Reviewed annually; amendments require approval by the Clinical Director."]]]},
{t:"Client Referral Processing",s:"SOP: Processing Client Referrals from Community Partners, including IFHP (January 2026)",b:[
["Purpose and scope",["~A clear, ethical, and timely process for receiving and documenting referrals, creating complete client profiles, meeting CRPO/OCSWSSW and IFHP requirements, and assigning clients after intake. Referrals are processed within 48 hours. Applies to IFHP clients, refugee/newcomer referrals, community organization referrals (settlement agencies, legal clinics, hospitals, social services), and all funded or partially funded psychotherapy cases."]],
["Roles",["Clinical Director: oversees the referral workflow, makes the final therapist assignment, ensures IFHP compliance and billing oversight","Virtual Assistant / Admin Support: creates the client account, requests documentation, updates the IFHP spreadsheet, books intake within 48 hours","Intern (Intake Clinician): completes intake, ensures forms are signed, conducts needs assessment, confirms documentation","Assigned Therapist: provides ongoing psychotherapy, tracks attendance, submits billing documentation"]],
["Step 1: Referral receipt (Day 0)",["~Referrals arrive by secure email, partner referral form, phone call, or encrypted platform. Within 24 hours: acknowledge the referral to the partner and confirm the client’s full legal name, date of birth, phone, email, language preference, and funding source (IFHP / other)."]],
["Step 2: Create client account (within 24 hours)",["~In JaneApp (or EMR): full legal name (as on ID), date of birth, complete address with postal code, phone, email, health number (if applicable), IFHP certificate number (if applicable), and emergency contact name, relationship, and phone. The account must NOT remain incomplete."]],
["Step 3: Documentation collection",["Photo ID (clear image; government-issued preferred; IFHP certificate if applicable)","Doctor referral letter that explicitly states “Referral for psychotherapy services” (generic “mental health support” wording is not sufficient for IFHP billing)","Any relevant IFHP eligibility documentation and legal documents (if related to trauma or displacement)","~Admin sends secure upload instructions. The file is marked “Pending Documentation” until complete."]],
["Step 4: Book intake within 48 hours",["~Book with an intern intake clinician within 48 hours of referral receipt. The session covers the intake form, confidentiality review, limits of confidentiality, informed consent, IFHP consent (if applicable), needs assessment, risk screening, and cultural/language considerations.","If the client does not respond: 2 contact attempts within 48 hours, with outreach documented"]],
["Step 5: Intake session requirements",["~The intern ensures:","Confidentiality agreement signed; consent for psychotherapy signed","Consent for virtual care and consent to record signed (if applicable)","Emergency contact verified; documentation uploaded; doctor referral confirmed","Risk assessment completed; presenting issues documented; provisional goals identified","~The intern completes the intake note, needs assessment summary, and recommendation for therapist assignment. Supervision review may occur before assignment if clinically complex."]],
["Step 6: Therapist assignment",["~The Clinical Director reviews the intake summary and assigns a therapist based on language match, cultural considerations, clinical complexity, therapist availability, and funding structure. The client is contacted within 24 hours of assignment."]],
["Steps 7 and 8: IFHP tracking and billing",["~Admin enters the client in the ICA IFHP Master Spreadsheet immediately after intake: full name, IFHP number, date of intake, assigned therapist, session rate, authorization details, billing category, and expiry date (if applicable).","After each session the therapist completes the session note within 24 hours, confirms attendance, and marks the session as IFHP-funded","Admin updates the spreadsheet, tracks total sessions used, flags approaching funding limits, and ensures billing aligns with attendance","Missed sessions are recorded but are NOT billable unless policy allows"]],
["Timelines summary",["Referral acknowledgment: within 24 hrs","Client account creation: within 24 hrs","Intake booking: within 48 hrs","Documentation collection: before intake or within 48 hrs","Therapist assignment: within 24 hrs post-intake","IFHP spreadsheet entry: immediately after intake"]],
["Quality assurance, privacy and red flags",["Monthly audit: emergency contact in file, signed consents, doctor referral for IFHP, documentation completeness, IFHP billing reconciliation, attendance tracking accuracy. Non-compliance leads to chart correction requests, supervision review, and possible billing delay","All documents uploaded via secure portal only; no ID sent via unsecured messaging; IFHP spreadsheet stored in an encrypted drive","WhatsApp must NOT include client identifying information; client names are never discussed in non-secure channels","~Red flags requiring immediate Clinical Director review: active suicidal ideation, safety concerns, domestic violence risk, IFHP eligibility concerns, missing referral documentation, ethical or legal concerns."]],
["KPIs and required documentation checklist",["100% of referrals booked within 48 hours","100% of files contain an emergency contact","100% of IFHP clients have a doctor referral on file","100% of sessions tracked in the IFHP spreadsheet","95% chart completion within 24 hours","~Checklist: photo ID, IFHP certificate, doctor referral (states psychotherapy), signed consent, confidentiality agreement, emergency contact, intake form, risk assessment, IFHP spreadsheet entry."]]]},
{t:"IFHP Client Policy",s:"Clinic Policy ICA-IFHP-001: Service Delivery and Documentation Requirements for IFHP Clients (effective March 19, 2026; review March 19, 2027)",b:[
["Policy statement and scope",["~ICA is committed to timely, ethical, clinically appropriate, and well-documented mental health services to clients funded through the Interim Federal Health Program (IFHP). All clinicians must follow clinic processes, documentation standards, and timelines. The policy applies to registered psychotherapists, social workers, student interns, supervised clinicians, and independent contractors, from referral receipt through treatment completion, discharge, or transfer of care."]],
["Referral and assessment",["Book the assessment appointment within 48 hours of receiving an IFHP referral; if the client cannot be reached, make and document reasonable efforts and tell ICA administration or the clinic lead promptly","Complete the assessment report within 5 business days, using the ICA assessment template, reflecting presenting concerns, psychosocial and clinical history, symptoms, functional impairment, and treatment recommendations","Do not schedule psychotherapy beyond the assessment until pre-approval is received, unless ICA has explicitly directed you to proceed; never assume authorization, and document any exception from clinic leadership"]],
["Treatment and documentation",["IFHP clients are generally seen one to two times per week, based on clinical need, authorization, presentation, and clinic direction, reflected in the treatment plan and notes","Use ICA-approved templates and timelines for assessment documentation, assessment reports, progress notes, progress reports, letters of support, and supplementary documentation","Complete a progress note after every session: accurate, objective, clinically relevant, professional, and on time","Complete a formal progress report by the end of Session 9: treatment to date, attendance and engagement, current presentation, ongoing symptoms and functional impairment, progress toward goals, recommendations, and any barriers, concerns, or risks"]],
["Doctor’s note, letter of support and billing",["For every ten sessions the client must provide a new doctor’s note; remind clients in advance and tell the clinic if it has not been received; do not assume care beyond the approved period","Provide a letter of support for every IFHP client after 10 psychotherapy sessions, based on direct clinical involvement, using the ICA template, accurate and submitted on time","All IFHP billing is completed by ICA under the clinic provider number; clinicians may not submit IFHP billing independently","Ensure documentation is complete and on time, session dates and details are accurate, and administrative requests are answered promptly"]],
["Roles, non-compliance and review",["~Clinicians: book assessments within 48 hours, complete reports on time, follow templates, schedule only after pre-approval, track the 10-session milestones, and communicate delays, risks, or barriers. Administration and clinic leadership: coordinate referrals, support pre-approvals and billing, provide templates and standards, communicate updates, monitor compliance, and direct on exceptions.","Non-compliance may lead to delayed payment, referral reassignment, additional supervision or corrective action, review of suitability for IFHP referrals, or other follow-up; repeated failure may be treated as a performance or practice concern","ICA may review files, documentation, timelines, and compliance; the policy is reviewed annually or when IFHP requirements, operations, standards, billing, or regulations change","~Related documents: IFHP Assessment Template, Progress Note Template, Progress Report Template, Letter of Support Template, Documentation Standards Policy, Billing Procedures Policy, Clinical Supervision and Accountability Policies."]]]}
];
